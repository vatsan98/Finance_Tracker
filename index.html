/* A statement-ledger look: cool slate neutrals, ruled rows, figures set in mono
   so every column of digits lines up. Copper is the only accent; green and red
   are reserved for direction of money, never for emphasis. */
:root{
  --bg:#eff1f4; --card:#fbfbfc; --sunk:#e7eaee;
  --text:#161a21; --muted:#666f7d; --line:#dadee4; --rule:#e6e9ee;
  --in:#1f6b4d; --out:#a83f34; --accent:#9a6423; --accent-soft:#9a642322;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101319; --card:#181c24; --sunk:#12151c;
    --text:#e7eaf0; --muted:#8d97a6; --line:#262c37; --rule:#222833;
    --in:#4cc08c; --out:#f4776d; --accent:#d59a55; --accent-soft:#d59a5526;
  }
}
:root[data-theme="dark"]{
  --bg:#101319; --card:#181c24; --sunk:#12151c;
  --text:#e7eaf0; --muted:#8d97a6; --line:#262c37; --rule:#222833;
  --in:#4cc08c; --out:#f4776d; --accent:#d59a55; --accent-soft:#d59a5526;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
main{max-width:560px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 14px 100px}
header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
h1{font-size:17px; margin:0; font-weight:600; letter-spacing:.06em; text-transform:uppercase}
h2{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
   margin:24px 0 8px; font-weight:600; display:flex; justify-content:space-between; gap:10px}
h2 .r{color:var(--muted); font-weight:600; letter-spacing:.04em; text-transform:none}
.label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; font-weight:600}
.num{font-family:"Plex Figure",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;
     font-weight:600; letter-spacing:-.01em}

.card{background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:14px; margin-bottom:10px}
.total{text-align:center; padding:18px 14px; background:var(--sunk); border-style:dashed}
.total .big{font-size:29px; margin-top:5px}

.switch{display:flex; gap:6px; margin-bottom:12px}
.switch button{flex:1; padding:9px 4px; border:1px solid var(--line); background:var(--card);
  border-radius:9px; font-size:12.5px; font-weight:600; letter-spacing:.05em; color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}

/* the month picker: two narrow steppers around the month on screen */
.switch.mp button:first-child, .switch.mp button:last-child{
  flex:0 0 46px; font-size:19px; line-height:1; letter-spacing:0; padding:7px 4px}
.mp-now{flex:1; text-transform:none; font-size:13.5px; letter-spacing:.02em;
  color:var(--text); background:var(--sunk)}
.mp-back{display:block; font-size:9.5px; font-weight:500; letter-spacing:.06em;
  text-transform:uppercase; color:var(--accent); margin-top:2px}

.pool{position:relative; overflow:hidden}
.pool.alert{border-color:var(--out)}
.pool.alert::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--out)}
.pool-head{display:flex; justify-content:space-between; align-items:center;
           padding-bottom:9px; border-bottom:1px solid var(--rule)}
.ccy{font-size:11px; font-weight:700; letter-spacing:.16em; color:var(--accent)}
.now{font-size:27px; margin-top:11px}
.caption{font-size:12px; color:var(--muted); margin-top:3px}

/* the waterfall: label left, figure right, ruled where the sheet rules */
.wf{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    padding:6px 0; font-size:13.5px}
.wf-l{color:var(--muted); min-width:0}
.wf-v{font-size:13.5px; white-space:nowrap}
.wf.rule{border-top:1px solid var(--rule); margin-top:4px; padding-top:9px}
.wf.strong .wf-l{color:var(--text); font-weight:600}
.wf.strong .wf-v{font-size:15px}
/* a breakdown line nested under a summary row above it */
.wf.sub{padding:4px 0 4px 14px; font-size:12.5px}
.wf.sub .wf-l{color:var(--muted); font-size:12.5px}
.wf.sub .wf-v{color:var(--muted); font-size:12.5px}
.wfblock{margin-top:12px}
.neg{color:var(--out)} .pos{color:var(--in)}

.item{display:flex; align-items:center; gap:11px; padding:11px 0;
      border-bottom:1px solid var(--rule); cursor:pointer}
.item:last-child{border-bottom:0; padding-bottom:2px}
.item .grow{flex:1; min-width:0}
.item .name{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .sub,.goal .sub{font-size:12.5px; color:var(--muted)}
.item .amt,.goal .amt{white-space:nowrap; font-size:15px}
.item.done .name{text-decoration:line-through; opacity:.5}
.item.done .amt,.item.done .sub{opacity:.45}
.pill{flex:0 0 auto; width:23px; height:23px; border-radius:50%; padding:0;
      border:1.5px solid var(--line); background:transparent; color:transparent;
      display:grid; place-items:center; font-size:12px; line-height:1}
.pill.paid{background:var(--in); border-color:var(--in); color:#fff}
.goal{padding:12px 0; border-bottom:1px solid var(--rule); cursor:pointer}
.goal:last-child{border-bottom:0; padding-bottom:2px}
.goal-top{display:flex; align-items:center; gap:10px}
.goal .meter,.goal .sub{margin-left:34px}
.goal-top .name{flex:1; min-width:0; font-weight:500; white-space:nowrap;
                overflow:hidden; text-overflow:ellipsis}
.meter{height:5px; border-radius:3px; background:var(--sunk); margin:10px 0 6px; overflow:hidden}
.meter i{display:block; height:100%; border-radius:3px; background:var(--accent)}
.meter.done i{background:var(--in)}
.chip{background:var(--accent-soft); color:var(--accent); border-radius:5px; padding:2px 6px;
      font-size:10px; font-weight:700; letter-spacing:.1em}
.chip.auto{background:transparent; border:1px solid var(--line); color:var(--muted)}

button{font:inherit; color:inherit; cursor:pointer}
.btn{width:100%; padding:13px; border-radius:11px; border:1px dashed var(--line);
     background:transparent; color:var(--accent); font-weight:600}
.btn.solid{border:1px solid var(--accent); background:var(--accent); color:#fff}
.btn.danger{border:0; background:transparent; color:var(--out); font-weight:600}
.icon{background:none; border:0; font-size:19px; padding:6px; line-height:1; color:var(--muted)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

<body>
<main id="app"></main>
<nav id="tabs"></nav>
<script>
'use strict';

/* ============================================================================
   The model is a monthly control sheet, ported from the spreadsheet this
   replaced. Per currency:

     opening balances + income outstanding − cards − dues − expense provision
       = net available − the minimum balance you keep
       = what is genuinely free to invest this month

   "Outstanding" is the load-bearing idea: an income or due line that is ticked
   paid drops out of the sum.

   The minimum balance lives on each account, not on the currency — it is the
   floor you keep in that specific bank, and the currency-level figure the
   waterfall shows is just their sum. Next month reruns the same arithmetic
   with every repeating line pending again; opening balances and card
   outstandings default to that floor and to zero, standing in until you know
   the real numbers and type them over — a forecast, not a derivation from
   this month's projected close, so a bad month never quietly poisons the next
   one's starting point.
   ========================================================================== */

const CURRENCIES = ['AED','INR','USD'];
const KEY = 'cashrunway.v3';

const DEFAULTS = {
  displayCurrency: 'AED',
  rates: { INRperAED: 26.0679, AEDperUSD: 3.6726 },  // market rate; the fee lives in `haircut`
  haircut: 0.9975,          // what a cross-currency transfer actually lands at
  cycleDay: 22,             // the day the spending cycle resets
  accounts: [],             // { id, name, currency, floor }
  cards:    [],             // { id, name, currency }
  lines:    [],             // { id, name, group:'income'|'due', currency, amount, repeats, month }
  goals:    [],             // { id, name, currency, target, saved, by }
  months:   {},             // 'YYYY-MM' -> { accounts:{id:n}, cards:{id:n}, lines:{id:'paid'}, goals:{id:{amount}} }
  updatedAt: null,          // ISO stamp of the last local edit; decides who wins a sync
  provision: { AED:0, INR:0, USD:0 }    // monthly discretionary budget, pro-rated by days left
};

let S = load();
let view = 'month';
let viewYm = thisMonthKey();   // the calendar month on screen — every figure is read for it
let sheetState = null;

function load(){
  const base = structuredClone(DEFAULTS);
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return upgrade(Object.assign(base, JSON.parse(raw)));
    const v2 = localStorage.getItem('cashrunway.v2');
    if (v2) return upgrade(Object.assign(base, JSON.parse(v2)));
    const old = localStorage.getItem('cashrunway.v1');
    if (old) return upgrade(migrate(JSON.parse(old), base));
  } catch {}
  return base;
}

/* Every way state can arrive — loaded, restored from a backup, pulled from the
   synced file — goes through here. Each step is a no-op on data that has
   already been through it, so it is safe to run on every path. */
function upgrade(s){ return migrateMonths(migrateFloor(s)); }

/* Minimum balance used to live per currency. Give its whole value to whichever
   account of that currency currently holds the most — a one-time guess the
   user can redistribute — so nothing about the floor silently vanishes. */
function migrateFloor(s){
  if (!s.floor) return s;
  for (const ccy of Object.keys(s.floor)){
    const amount = +s.floor[ccy] || 0;
    const mine = s.accounts.filter(a => a.currency === ccy);
    if (amount && mine.length && mine.every(a => a.floor == null)){
      mine.reduce((best, a) => (+a.balance || 0) > (+best.balance || 0) ? a : best).floor = amount;
    }
  }
  s.accounts.forEach(a => { if (a.floor == null) a.floor = 0; });
  delete s.floor;
  return s;
}

/* Figures used to hang off the record itself: one real number for this month,
   plus one optional forecast for next. A month is a first-class thing now, so
   they move into S.months keyed by calendar month — the typed figures land in
   the month they were actually about, and a forecast lands in the month it was
   stamped for. The record keeps only what is true of every month. */
function migrateMonths(s){
  if (!s.months) s.months = {};
  const now = thisMonthKey();
  const put = (kind, key, id, v) => {
    if (v == null || !key) return;
    const r = s.months[key] = s.months[key] || {};
    (r[kind] = r[kind] || {})[id] = v;
  };

  for (const a of (s.accounts || [])){
    if ('balance' in a){ put('accounts', now, a.id, +a.balance || 0); delete a.balance; }
    if (a.fcMonth) put('accounts', a.fcMonth, a.id, +a.fcBalance || 0);
    delete a.fcMonth; delete a.fcBalance;
  }
  for (const c of (s.cards || [])){
    if ('outstanding' in c){ put('cards', now, c.id, +c.outstanding || 0); delete c.outstanding; }
    if (c.fcMonth) put('cards', c.fcMonth, c.id, +c.fcOutstanding || 0);
    delete c.fcMonth; delete c.fcOutstanding;
  }
  for (const l of (s.lines || [])){
    if ('status' in l){
      if (l.status === 'paid') put('lines', now, l.id, 'paid');
      delete l.status;
    }
    // A one-off carried no month of its own; it was about the month it was entered in.
    if (!l.repeats && !l.month) l.month = now;
  }
  for (const g of (s.goals || [])){
    if (g.movedOn) put('goals', g.movedOn, g.id, { amount: +g.movedAmount || 0 });
    delete g.movedOn; delete g.movedAmount;
  }
  return s;
}

/* The first version tracked dated in/out items. Carry them over as pending
   monthly lines — the dates have no meaning in this model. */
function migrate(v1, base){
  base.accounts = (v1.accounts || []).map(a => ({ ...a, balance: +a.balance || 0, floor: 0 }));
  base.lines = (v1.items || []).map(i => ({
    id: i.id, name: i.name, currency: i.currency,
    group: i.kind === 'in' ? 'income' : 'due',
    amount: Math.abs(+i.amount) || 0,
    status: 'pending', repeats: i.repeat === 'monthly'
  }));
  return base;
}

function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

function save(){
  S.updatedAt = new Date().toISOString();
  persist();
  schedulePush();
  render();
}

/* Everything that travels between devices. The sync credentials deliberately
   live outside it, so they reach neither a backup nor the remote file. */
const payload = () => ({
  accounts:S.accounts, cards:S.cards, lines:S.lines, goals:S.goals, months:S.months,
  provision:S.provision, rates:S.rates, haircut:S.haircut,
  cycleDay:S.cycleDay, displayCurrency:S.displayCurrency, updatedAt:S.updatedAt });

const hasData = () => S.accounts.length || S.cards.length || S.lines.length || S.goals.length;

function adopt(d){
  Object.assign(S, {
    accounts:d.accounts || [], cards:d.cards || [], lines:d.lines || [], goals:d.goals || [],
    months:d.months || {}, provision:d.provision || S.provision, rates:d.rates || S.rates,
    haircut:d.haircut != null ? d.haircut : S.haircut,
    cycleDay:d.cycleDay != null ? d.cycleDay : S.cycleDay,
    displayCurrency:d.displayCurrency || S.displayCurrency, updatedAt:d.updatedAt || null });
  upgrade(S);
  persist();
}
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- dates ---------- */

/* Hoisted, because load() runs before the const helpers below are initialised
   and the migration inside it needs to know what month it is. */
function today(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function ym(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0'); }
function thisMonthKey(){ return ym(today()); }

const daysInMonth = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
const clampDay = (d, day) => new Date(d.getFullYear(), d.getMonth(), Math.min(day, daysInMonth(d)));

/* A month key is 'YYYY-MM', and it is the app's unit of time: every balance,
   status and transfer is read for exactly one of them. The arithmetic goes
   through Date so December rolls into January without a special case. */
const ymParts = k => String(k || '').split('-').map(Number);
const ymDate = k => { const [y,m] = ymParts(k); return new Date(y, m - 1, 1); };
const ymAdd = (k, n) => { const [y,m] = ymParts(k); return ym(new Date(y, m - 1 + n, 1)); };
const ymDiff = (from, to) => { const [ay,am] = ymParts(from), [by,bm] = ymParts(to);
  return (by - ay) * 12 + (bm - am); };
const isThisMonth = k => k === thisMonthKey();
const monthTitle = k => ymParts(k)[0]
  ? ymDate(k).toLocaleDateString(undefined, { month:'long', year:'numeric' }) : '—';

/* Days until the cycle resets. The spreadsheet measured to this month's cycle
   day only, so the provision fell to zero for the rest of the month once that
   date passed; this rolls to the next occurrence instead. */
function daysToCycle(){
  const t = today();
  let d = clampDay(t, S.cycleDay);
  if (d < t) d = clampDay(new Date(t.getFullYear(), t.getMonth() + 1, 1), S.cycleDay);
  return Math.min(Math.round((d - t) / 86400000), 30);
}

const ordinal = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const monthLabel = by => ymParts(by)[0]
  ? ymDate(by).toLocaleDateString(undefined, { month:'short', year:'numeric' }) : '—';
// Months from the month you are looking at to the one a goal is needed by.
const monthsUntil = (by, from) => ymParts(by)[0] ? ymDiff(from || viewYm, by) : 0;
const defaultBy = () => ymAdd(thisMonthKey(), 6);

/* What a goal still needs moved in a given month: the shortfall spread evenly
   over the months from that one to the month it is needed by, counting both
   ends. Ticking a month's transfer as moved drops it to zero there and
   re-levels every other month, because ticking adds to `saved` and so shrinks
   the shortfall the rest are sharing. A goal whose month has already gone by
   needs the whole remainder in whatever month you are looking at. */
function goalMonthly(g, k){
  const remaining = Math.max(0, (+g.target || 0) - (+g.saved || 0));
  if (!remaining || goalMoved(g, k)) return 0;
  const left = monthsUntil(g.by, k);
  return left < 0 ? remaining : remaining / (left + 1);
}

/* A goal not yet moved is still sitting in the account, same as the minimum
   balance is — but both are earmarked, not free, so both come out before
   arriving at what genuinely is. A goal already ticked moved this month drops
   to 0 here (goalMonthly does that), since that money has left the account and
   the balance you type is expected to already reflect it — so nothing is ever
   subtracted twice for the same goal in the same month. */

/* ---------- money ---------- */

const LOCALES = { INR:'en-IN', AED:'en-AE', USD:'en-US' };
// Normalise Intl's hyphen to a real minus sign so a negative figure lines up
// with the signed rows in the waterfall.
const money = (n, ccy) => new Intl.NumberFormat(LOCALES[ccy] || 'en-US',
  { style:'currency', currency:ccy, minimumFractionDigits:0, maximumFractionDigits:0 })
  .format(n || 0).replace(/^-/, '\u2212');
const signed = (n, ccy) => (n < 0 ? '−' : n > 0 ? '+' : '') + money(Math.abs(n), ccy);

const toAED = (n, c) => c === 'AED' ? n : c === 'USD' ? n * S.rates.AEDperUSD : n / S.rates.INRperAED;
const fromAED = (n, c) => c === 'AED' ? n : c === 'USD' ? n / S.rates.AEDperUSD : n * S.rates.INRperAED;
const convert = (n, from, to) => fromAED(toAED(n, from), to);

/* ---------- the engine ---------- */

/* Nothing is stored for a month until you type something into it, and what is
   absent has a defined answer rather than being blank: an account sits at its
   own minimum balance, a card is paid off, a line is still outstanding. So any
   untouched month — past, present or future — reads as the conservative case,
   and typing one figure stops only that one figure being assumed. Clearing a
   figure back to its assumption removes the entry, so a month you have emptied
   is indistinguishable from one you never opened. */
const held = (kind, k, id) => { const r = S.months[k]; return r && r[kind] ? r[kind][id] : undefined; };
const isSet = (kind, k, id) => held(kind, k, id) !== undefined;
const monthTouched = k => !!S.months[k];

function setHeld(kind, k, id, v){
  if (v === undefined){
    const r = S.months[k];
    if (!r || !r[kind]) return;
    delete r[kind][id];
    if (!Object.keys(r[kind]).length) delete r[kind];
    if (!Object.keys(r).length) delete S.months[k];
    return;
  }
  const r = S.months[k] = S.months[k] || {};
  (r[kind] = r[kind] || {})[id] = v;
}

const accountValue = (a, k) => { const v = held('accounts', k, a.id);
  return v === undefined ? (+a.floor || 0) : (+v || 0); };
const cardValue = (c, k) => { const v = held('cards', k, c.id);
  return v === undefined ? 0 : (+v || 0); };
const lineIsPaid = (l, k) => held('lines', k, l.id) === 'paid';
const goalMoved = (g, k) => held('goals', k, g.id);

const activeCurrencies = () => CURRENCIES.filter(c =>
  S.accounts.some(a => a.currency === c) ||
  S.cards.some(x => x.currency === c) ||
  S.lines.some(l => l.currency === c) ||
  S.goals.some(g => g.currency === c));

const sum = (arr, k) => arr.reduce((s, x) => s + (+x[k] || 0), 0);

/* A line belongs to a month if it repeats, or if it is the one-off entered
   against that month; it counts there while it is still outstanding there.
   Only the month actually running is part-spent, so it is the only one whose
   provision is pro-rated — every other month budgets a full thirty days. */
const linesIn = k => S.lines.filter(l => l.repeats || l.month === k);

function monthFor(ccy, k){
  const mine = linesIn(k).filter(l => l.currency === ccy);
  const live = mine.filter(l => !lineIsPaid(l, k));

  const myAccounts = S.accounts.filter(a => a.currency === ccy);
  const myCards    = S.cards.filter(x => x.currency === ccy);

  const opening   = myAccounts.reduce((s,a) => s + accountValue(a, k), 0);
  const income    = sum(live.filter(l => l.group === 'income'), 'amount');
  const dues      = sum(live.filter(l => l.group === 'due'), 'amount');
  const cards     = myCards.reduce((s,c) => s + cardValue(c, k), 0);
  const days      = isThisMonth(k) ? daysToCycle() : 30;
  const provision = (+S.provision[ccy] || 0) * days / 30;
  const goals     = S.goals.filter(g => g.currency === ccy)
                           .reduce((s,g) => s + goalMonthly(g, k), 0);
  const floor     = sum(myAccounts, 'floor');

  const net = opening + income - cards - dues - provision;
  const investable = net - floor - goals;
  return { ccy, opening, income, cards, dues, provision, goals, days, net, floor, investable };
}

/* Cover every currency that sits below its floor out of whichever currency has
   the most spare, the way the sheet moved surplus AED into INR. */
function transfersFor(months, act){
  const spare = {}, moves = [], net = {};
  for (const c of act){ spare[c] = months[c].investable; net[c] = 0; }

  for (const need of act.filter(c => spare[c] < -0.5).sort((a,b) => spare[a] - spare[b])){
    while (spare[need] < -0.5){
      const from = act.filter(c => c !== need && spare[c] > 0.5)
                      .sort((a,b) => toAED(spare[b],b) - toAED(spare[a],a))[0];
      if (!from) break;
      // What must leave `from` so that `need` receives the shortfall, after the haircut.
      const wanted = convert(-spare[need], need, from) / S.haircut;
      const amount = Math.min(spare[from], wanted);
      const lands  = convert(amount, from, need) * S.haircut;
      moves.push({ from, to: need, amount, lands });
      spare[from] -= amount; spare[need] += lands;
      net[from]   -= amount; net[need]   += lands;
    }
  }
  return { moves, net };
}

function computeAll(){
  const act = activeCurrencies();
  const m = {};
  for (const c of act) m[c] = monthFor(c, viewYm);
  return { act, m, moves: transfersFor(m, act).moves };
}

/* ---------- views ---------- */

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function wf(label, value, ccy, o){
  o = o || {};
  return '<div class="wf' + (o.rule ? ' rule' : '') + (o.strong ? ' strong' : '') +
      (o.sub ? ' sub' : '') + '">' +
    '<span class="wf-l">' + label + '</span>' +
    '<span class="wf-v num' + (o.cls ? ' ' + o.cls : '') + '">' +
      (o.text ? o.text : o.sign ? signed(value, ccy) : money(value, ccy)) + '</span></div>';
}

function monthView(){
  const { act, m, moves: mv } = computeAll();
  if (!act.length){
    return '<div class="card empty">Nothing to work with yet.<br><br>' +
      'Put your bank balances and card outstandings on the <b>Accounts</b> tab, ' +
      'then your salary and dues under <b>Money</b>.</div>';
  }

  let html = monthTouched(viewYm) ? '' :
    '<div class="hint" style="margin:-4px 0 12px">Nothing typed against ' + monthTitle(viewYm) +
    ' yet, so every account sits at its minimum balance, every card is paid off and every line ' +
    'is still outstanding. Type a figure on <b>Accounts</b>, or tick a line on <b>Money</b>, and ' +
    'only what you touch stops being assumed.</div>';

  if (act.length > 1){
    const dc = S.displayCurrency;
    const free = act.reduce((s,c) => s + convert(m[c].investable, c, dc), 0);
    const short = act.filter(c => m[c].investable < 0);
    html += '<div class="card total">' +
      '<div class="label">Free to invest</div>' +
      '<div class="big num' + (free < 0 ? ' neg' : '') + '">≈ ' + money(free, dc) + '</div>' +
      '<div class="hint">' + (short.length
        ? 'after your dues and minimum balances — but ' + short.join(' and ') +
          (short.length > 1 ? ' still need' : ' still needs') + ' topping up first'
        : 'after everything outstanding and your minimum balances') + '</div></div>';
  }

  for (const c of act){
    const p = m[c], short = p.investable < 0;
    const myGoals = S.goals.filter(g => g.currency === c);
    const goalRows = myGoals.map(g => {
      const target = +g.target || 0, saved = Math.min(+g.saved || 0, target);
      const full = target > 0 && saved >= target;
      const amt = goalMonthly(g, viewYm);
      const label = full ? 'funded' : goalMoved(g, viewYm) ? 'moved' : money(amt, c);
      return wf(esc(g.name), 0, c, { sub:true, text: label });
    }).join('');

    html += '<div class="card pool' + (short ? ' alert' : '') + '">' +
      '<div class="pool-head"><span class="ccy">' + c + '</span>' +
        '<span class="label">' + (short ? 'short' : '') + '</span></div>' +
      '<div class="now num' + (short ? ' neg' : '') + '">' + money(p.investable, c) + '</div>' +
      '<div class="caption">' + (short
        ? 'nothing free until this is covered'
        : money(p.net, c) + ' available, holding ' + money(p.floor, c) + ' back') + '</div>' +
      '<div class="wfblock">' +
        wf(isThisMonth(viewYm) ? 'Bank balances' : 'Opening balance', p.opening, c) +
        wf('Income outstanding', p.income, c, { sign:true, cls: p.income >= 0 ? 'pos' : 'neg' }) +
        (p.cards ? wf('Card outstanding', -p.cards, c, { sign:true, cls:'neg' }) : '') +
        wf('Dues outstanding', -p.dues, c, { sign:true, cls:'neg' }) +
        (p.provision ? wf('Spending provision · ' + p.days + '/30 days', -p.provision, c, { sign:true, cls:'neg' }) : '') +

        wf('Net available', p.net, c, { rule:true, strong:true, cls: p.net < 0 ? 'neg' : '' }) +
        wf('Minimum balance to hold', -p.floor, c, { sign:true, cls:'neg' }) +
        (myGoals.length ? wf('Allocation to goals', -p.goals, c, { sign:true, cls: p.goals > 0 ? 'neg' : '' }) + goalRows : '') +
        wf('Free to invest', p.investable, c, { rule:true, strong:true, cls: short ? 'neg' : '' }) +
      '</div></div>';
  }

  if (mv.length){
    html += '<h2>Move money</h2><div class="card">' + mv.map(t =>
      '<div class="item" style="cursor:default"><div class="grow">' +
        '<div class="name">' + t.from + ' → ' + t.to + '</div>' +
        '<div class="sub">lands as ' + money(t.lands, t.to) + ' after the ' +
          ((1 - S.haircut) * 100).toFixed(2).replace(/\.?0+$/,'') + '% haircut</div></div>' +
        '<div class="amt num">' + money(t.amount, t.from) + '</div></div>').join('') +
      '</div><div class="hint">Enough to bring every currency back to its minimum balance.</div>';
  }
  return html;
}

function moneyView(){
  const dc = S.displayCurrency;
  const days = isThisMonth(viewYm) ? daysToCycle() : 30;

  // Every month is tickable, and each keeps its own statuses — a line ticked
  // paid in August is still outstanding in September.
  const block = (group, title) => {
    const list = linesIn(viewYm).filter(l => l.group === group);
    const open = list.filter(l => !lineIsPaid(l, viewYm));
    let owed = open.reduce((s,l) => s + convert(+l.amount || 0, l.currency, dc), 0);
    const extra = group === 'due' ? provisionRows() : '';
    if (group === 'due') owed += activeCurrencies()
      .reduce((s,c) => s + convert((+S.provision[c] || 0) * days / 30, c, dc), 0);
    if (!list.length && !extra) return '';
    const header = open.length + ' of ' + list.length + ' left · ≈ ' + money(owed, dc);
    return '<h2>' + title + '<span class="r">' + header + '</span></h2><div class="card">' +
      list.map(l => {
        const paid = lineIsPaid(l, viewYm);
        const pill = '<button class="pill' + (paid ? ' paid' : '') + '" data-toggle="' + l.id + '" ' +
              'aria-label="Mark ' + (paid ? 'unpaid' : 'paid') + '">✓</button>';
        const sub = (paid ? 'paid' : 'outstanding') +
              (l.repeats ? ' · every month' : ' · one time');
        return '<div class="item' + (paid ? ' done' : '') + '" data-edit-line="' + l.id + '">' +
          pill +
          '<div class="grow"><div class="name">' + esc(l.name) + '</div>' +
            '<div class="sub">' + sub + '</div></div>' +
          '<span class="chip">' + l.currency + '</span>' +
          '<div class="amt num ' + (group === 'income' && +l.amount >= 0 ? 'pos' : 'neg') + '">' +
            money(+l.amount || 0, l.currency) + '</div></div>';
      }).join('') + extra + '</div>';
  };

  // The provision is computed, not entered — show it where the sheet kept it.
  function provisionRows(){
    const d = days;
    const label = isThisMonth(viewYm)
      ? d + ' of 30 days to the ' + ordinal(S.cycleDay) : 'a full month';
    return activeCurrencies().filter(c => +S.provision[c]).map(c =>
      '<div class="item" data-settings><div class="grow">' +
        '<div class="name">Spending provision</div>' +
        '<div class="sub">' + label + '</div></div>' +
        '<span class="chip">' + c + '</span><span class="chip auto">AUTO</span>' +
        '<div class="amt num neg">' + money((+S.provision[c] || 0) * d / 30, c) + '</div></div>').join('');
  }

  const goals = () => {
    if (!S.goals.length) return '';
    const toMove = S.goals.reduce((s,g) => s + convert(goalMonthly(g, viewYm), g.currency, dc), 0);
    return '<h2>Goals<span class="r">' + (toMove > 0.5 ? '≈ ' + money(toMove, dc) + ' still to move'
                                                       : 'nothing left to move') + '</span></h2><div class="card">' +
      S.goals.map(g => {
        const target = +g.target || 0, saved = Math.min(+g.saved || 0, target);
        const full = target > 0 && saved >= target;
        const moved = goalMoved(g, viewYm);
        const left = monthsUntil(g.by, viewYm), per = goalMonthly(g, viewYm);
        const pct = target > 0 ? Math.max(0, Math.min(100, saved / target * 100)) : 0;
        const status = full ? 'fully funded'
          : moved ? money(+moved.amount || 0, g.currency) + ' moved in ' + monthLabel(viewYm)
          : left < 0 ? 'was due ' + monthLabel(g.by) + ' · ' + money(target - saved, g.currency) + ' short'
          : 'by ' + monthLabel(g.by) + ' · ' + (left === 0 ? 'needed this month' : left + ' months to go');
        return '<div class="goal" data-edit-goal="' + g.id + '">' +
          '<div class="goal-top">' +
            (full
              ? '<span class="pill paid" aria-hidden="true">✓</span>'
              : '<button class="pill' + (moved ? ' paid' : '') + '" data-goal-toggle="' + g.id +
                '" aria-label="' + (moved ? 'Undo the transfer for this month' : 'Mark this month\'s transfer moved') +
                '">✓</button>') +
            '<span class="name">' + esc(g.name) + '</span>' +
            '<span class="chip">' + g.currency + '</span>' +
            '<span class="amt num' + (full || moved ? '' : ' neg') + '">' +
              (full ? '—' : moved ? 'moved' : money(per, g.currency) + (left < 0 ? '' : '/mo')) + '</span></div>' +
          '<div class="meter' + (full ? ' done' : '') + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
          '<div class="sub">' + money(saved, g.currency) + ' of ' + money(target, g.currency) +
            ' · ' + status + '</div></div>';
      }).join('') + '</div>';
  };

  const html = block('income', 'Money in') + block('due', 'Dues and expenses') + goals();
  return (html || '<div class="card empty">Add your salary, then the dues you pay each month.<br><br>' +
    'Tick a line off as it clears — anything still outstanding is what the month view counts.</div>') +
    '<button class="btn" data-edit-line="new">+ Add income or due</button>' +
    '<div style="height:8px"></div><button class="btn" data-edit-goal="new">+ Add a goal</button>';
}

function accountsView(){
  const section = (list, kind, title) => {
    if (!list.length) return '';
    let out = '<h2>' + title + '</h2><div class="card">';
    for (const c of CURRENCIES){
      const mine = list.filter(x => x.currency === c);
      if (!mine.length) continue;
      out += mine.map(x => {
        const val = kind === 'card' ? cardValue(x, viewYm) : accountValue(x, viewYm);
        const set = isSet(kind === 'card' ? 'cards' : 'accounts', viewYm, x.id);
        const assumed = set ? ''
          : '<div class="sub">' + (kind === 'card' ? 'assumed paid off' : 'assumed at minimum') + '</div>';
        return '<div class="item" data-edit-' + kind + '="' + x.id + '"><div class="grow">' +
            '<div class="name">' + esc(x.name) + '</div>' + assumed + '</div>' +
          '<span class="chip">' + c + '</span>' +
          (set ? '' : '<span class="chip auto">AUTO</span>') +
          '<div class="amt num' + (kind === 'card' ? ' neg' : '') + '">' + money(val, c) + '</div></div>';
      }).join('');
    }
    return out + '</div>';
  };

  let html = section(S.accounts, 'account', 'Bank balances') +
             section(S.cards, 'card', 'Credit cards');
  if (!html) html = '<div class="card empty">Add each bank account and what is in it right now, ' +
    'then any card with an outstanding balance.</div>';
  return html + '<button class="btn" data-edit-account="new">+ Add bank account</button>' +
    '<div style="height:8px"></div><button class="btn" data-edit-card="new">+ Add credit card</button>';
}

const backupJSON = () => JSON.stringify(payload());

const setPath = (obj, path, v) => {
  const parts = path.split('.');
  const last = parts.pop();
  parts.forEach(p => obj = obj[p]);
  obj[last] = v;
};

/* Read the live inputs back into the draft, so tapping a segment never loses
   whatever is already typed. */
function captureDraft(){
  if (!sheetState) return;
  document.querySelectorAll('.sheet [data-k]').forEach(el =>
    setPath(sheetState.draft, el.dataset.k, el.value));
}

function commit(){
  captureDraft();
  const d = sheetState.draft, t = sheetState.type;
  const named = (fallback) => (d.name || '').trim() || fallback;

  if (t === 'account'){
    const id = sheetState.id || uid();
    upsert(S.accounts, { id, name: named('Account'), currency: d.currency, floor: +d.floor || 0 });
    setHeld('accounts', viewYm, id, d.mode === 'manual' ? (+d.balance || 0) : undefined);
  } else if (t === 'card'){
    const id = sheetState.id || uid();
    upsert(S.cards, { id, name: named('Card'), currency: d.currency });
    setHeld('cards', viewYm, id, d.mode === 'manual' ? (+d.outstanding || 0) : undefined);
  } else if (t === 'goal'){
    upsert(S.goals, { id: sheetState.id || uid(), name: named('Goal'), currency: d.currency,
                      target: +d.target || 0, saved: +d.saved || 0, by: d.by || defaultBy() });
  } else if (t === 'line'){
    const id = sheetState.id || uid();
    const repeats = d.repeats === 'yes';
    const was = S.lines.find(x => x.id === id);
    const month = repeats ? null : (d.month || viewYm);
    // A one-off dragged to another month takes its status with it, rather than
    // leaving one stranded in a month it no longer appears in.
    if (was && !was.repeats && was.month !== month) setHeld('lines', was.month, id, undefined);
    upsert(S.lines, { id, name: named('Line'), group: d.group, currency: d.currency,
                      amount: +d.amount || 0, repeats, month });
    setHeld('lines', repeats ? viewYm : month, id, d.status === 'paid' ? 'paid' : undefined);
  } else {
    S.displayCurrency = d.displayCurrency;
    S.rates.INRperAED = +d.rates.INRperAED || S.rates.INRperAED;
    S.rates.AEDperUSD = +d.rates.AEDperUSD || S.rates.AEDperUSD;
    S.haircut  = +d.haircut > 0 ? +d.haircut : 1;
    S.cycleDay = Math.min(31, Math.max(1, +d.cycleDay || 1));
    for (const c of CURRENCIES) S.provision[c] = +d.provision[c] || 0;
    const repo = (d.sync.repo || '').trim(), path = (d.sync.path || '').trim() || 'state.json';
    if (repo !== sync.repo || path !== sync.path) sync.base = null;   // a different file, a different lineage
    Object.assign(sync, { repo, path, token: (d.sync.token || '').trim() });
    saveSync();
    if (syncOn()){ syncInfo.sha = null; setTimeout(runSync, 0); }
    else syncInfo = { status:'off', note:'', sha:null, at:null, remote:null };
    // Only restore when the box was actually edited — otherwise saving any other
    // setting would write the pre-edit snapshot straight back over it.
    if (d.backup != null && d.backup.trim() !== d.backupWas.trim()){
      try {
        const b = JSON.parse(d.backup);
        if (Array.isArray(b.accounts) && Array.isArray(b.lines)){
          Object.assign(S, { accounts:b.accounts, cards:b.cards || [], lines:b.lines,
            goals:b.goals || [], months:b.months || {},
            provision:b.provision || S.provision, rates:b.rates || S.rates });
          upgrade(S);   // an old-shaped backup carries a currency floor and per-record figures
        } else alert('That backup is missing its accounts or lines — nothing was restored.');
      } catch { alert('That backup text is not valid JSON — your other settings were still saved.'); }
    }
  }
  sheetState = null;
  save();
}

function upsert(list, rec){
  const i = list.findIndex(x => x.id === rec.id);
  if (i >= 0) list[i] = rec; else list.push(rec);
}

/* ============================================================================
   Sync — one JSON file in a private GitHub repo of your own.

   The contents API demands the blob sha you last read, so a device holding
   stale data is refused rather than allowed to overwrite. That refusal is the
   whole safety story: on a clash you are asked which side wins, and every save
   is a commit you can read back or roll back.

   Credentials live under their own storage key so they never reach a backup
   or the synced file.
   ========================================================================== */

const SYNC_KEY = 'cashrunway.sync';
let sync = loadSync();
let syncInfo = { status:'off', note:'', sha:null, at:null, remote:null };
let pushTimer = null;

function loadSync(){
  const blank = { repo:'', path:'state.json', token:'', base:null };
  try { return Object.assign(blank, JSON.parse(localStorage.getItem(SYNC_KEY) || '{}')); }
  catch { return blank; }
}
const saveSync = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch {} };
const syncOn = () => !!(sync.repo && sync.token);

const b64 = {
  encode: str => {
    const bytes = new TextEncoder().encode(str);
    let out = '';
    for (let i = 0; i < bytes.length; i += 0x8000)
      out += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(out);
  },
  decode: str => new TextDecoder().decode(
    Uint8Array.from(atob(str.replace(/\s/g, '')), c => c.charCodeAt(0)))
};

const ghUrl = () => 'https://api.github.com/repos/' + sync.repo.trim().replace(/^\/|\/$/g, '') +
                    '/contents/' + sync.path.trim().replace(/^\//, '');

const gh = (method, body) => fetch(ghUrl(), {
  method, cache:'no-store',
  headers: { Authorization: 'Bearer ' + sync.token.trim(),
             Accept: 'application/vnd.github+json',
             'X-GitHub-Api-Version': '2022-11-28' },
  body: body ? JSON.stringify(body) : undefined });

async function ghFail(r){
  const hint = r.status === 401 ? 'the token was rejected'
             : r.status === 403 ? 'the token lacks Contents write on that repo'
             : r.status === 404 ? 'no such repo or path'
             : 'GitHub returned ' + r.status;
  let detail = '';
  try { detail = (await r.json()).message || ''; } catch {}
  return new Error(hint + (detail ? ' — ' + detail : ''));
}

async function ghRead(){
  const r = await gh('GET');
  if (r.status === 404){ syncInfo.sha = null; return null; }
  if (!r.ok) throw await ghFail(r);
  const j = await r.json();
  syncInfo.sha = j.sha;
  return JSON.parse(b64.decode(j.content));
}

async function ghWrite(){
  const body = { message: 'Cash Runway — ' + new Date().toISOString(),
                 content: b64.encode(JSON.stringify(payload(), null, 1)) };
  if (syncInfo.sha) body.sha = syncInfo.sha;
  const r = await gh('PUT', body);
  if (r.status === 409 || r.status === 422) return 'stale';
  if (!r.ok) throw await ghFail(r);
  syncInfo.sha = (await r.json()).content.sha;
  return 'ok';
}

const setSync = (status, note) => {
  syncInfo.status = status;
  syncInfo.note = note || '';
  if (status === 'ok'){ syncInfo.at = Date.now(); syncInfo.remote = null; }
  render();
};

/* The base is the remote version this device's state was last derived from.
   Comparing against it — rather than comparing clocks — is what makes a stale
   device detectable: two devices editing in either order both produce a base
   that no longer matches the remote sha, and neither can quietly win. */
function markSynced(){
  sync.base = { sha: syncInfo.sha, stamp: S.updatedAt || null };
  saveSync();
}
const conflict = remote => {
  syncInfo.remote = remote;
  setSync('conflict', 'Another device saved changes this one has not seen.');
};

async function runSync(){
  if (!syncOn() || syncInfo.status === 'busy') return;
  setSync('busy');
  try {
    const remote = await ghRead();          // also refreshes syncInfo.sha
    const base = sync.base;

    if (!remote){                            // nothing stored yet — seed it
      await ghWrite(); markSynced(); return setSync('ok');
    }
    if (!base){                              // this device has never synced
      if (hasData()){
        syncInfo.remote = remote;
        return setSync('conflict', 'This device holds data that has never been synced.');
      }
      adopt(remote); markSynced(); return setSync('ok');
    }

    const remoteMoved = syncInfo.sha !== base.sha;
    const localEdited = (S.updatedAt || null) !== base.stamp;

    if (remoteMoved && localEdited) return conflict(remote);
    if (remoteMoved){ adopt(remote); markSynced(); return setSync('ok'); }
    if (localEdited){
      if (await ghWrite() === 'stale') return conflict(await ghRead());
      markSynced();
    }
    setSync('ok');
  } catch (e){ setSync('error', e.message); }
}

function schedulePush(){
  if (!syncOn()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(runSync, 1500);
}

async function resolveConflict(keepMine){
  const remote = syncInfo.remote;
  syncInfo.remote = null;
  if (!keepMine){ adopt(remote); markSynced(); return setSync('ok'); }
  setSync('busy');
  try {                                     // syncInfo.sha is the live one, so this write lands
    if (await ghWrite() === 'stale') return conflict(await ghRead());
    markSynced();
    setSync('ok');
  } catch (e){ setSync('error', e.message); }
}

function syncLine(){
  if (syncInfo.status === 'conflict')
    return '<div class="card banner"><div>' + esc(syncInfo.note) +
      ' Which copy should win?</div><div class="acts">' +
      '<button class="btn" data-conflict="theirs">Use the other device</button>' +
      '<button class="btn solid" data-conflict="mine">Keep this one</button></div></div>';
  if (!syncOn()) return '';
  const ago = !syncInfo.at ? '' : (mins => mins < 1 ? 'just now'
    : mins < 60 ? mins + ' min ago' : Math.round(mins / 60) + ' h ago')
    (Math.round((Date.now() - syncInfo.at) / 60000));
  const text = syncInfo.status === 'busy'  ? 'Syncing…'
             : syncInfo.status === 'error' ? 'Sync failed · ' + esc(syncInfo.note)
             : syncInfo.status === 'ok'    ? 'Synced ' + ago
             : 'Not synced yet';
  return '<div class="syncline' + (syncInfo.status === 'error' ? ' bad' : '') +
         '" data-settings>' + text + '</div>';
}

/* ---------- shell ---------- */

const TABS = [
  { id:'month',    g:'◎', t:'Month'    },
  { id:'money',    g:'⇅', t:'Money'    },
  { id:'accounts', g:'▤', t:'Accounts' }
];

/* Any month, in either direction. The middle button names the one on screen
   and jumps back to the current one, so however far you have wandered getting
   home is a single tap. */
function monthPicker(){
  if (!hasData()) return '';
  const now = isThisMonth(viewYm);
  return '<div class="switch mp">' +
    '<button data-mstep="-1" aria-label="Previous month">‹</button>' +
    '<button class="mp-now" data-mjump aria-label="Go to this month">' + monthTitle(viewYm) +
      (now ? '' : '<span class="mp-back">tap for this month</span>') + '</button>' +
    '<button data-mstep="1" aria-label="Next month">›</button></div>';
}

function render(){
  const body = view === 'month' ? monthView() : view === 'money' ? moneyView() : accountsView();
  document.getElementById('app').innerHTML =
    '<header><h1>Cash Runway</h1><button class="icon" data-settings aria-label="Settings">⚙</button></header>' +
    syncLine() + monthPicker() + body;
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    '<button data-tab="' + t.id + '" aria-current="' + (view === t.id) + '">' +
    '<span class="g">' + t.g + '</span>' + t.t + '</button>').join('');

  const old = document.querySelector('.backdrop');
  if (old) old.remove();
  if (sheetState){
    const wrap = document.createElement('div');
    wrap.className = 'backdrop';
    wrap.innerHTML = '<div class="sheet">' + sheetHTML() + '</div>';
    document.body.appendChild(wrap);
  }
}

const openSheet = state => { sheetState = state; render(); };

document.addEventListener('click', e => {
  const hit = sel => e.target.closest(sel);

  // Ticking a line paid is the whole daily loop — keep it ahead of row editing.
  const tog = hit('[data-toggle]');
  if (tog){
    const l = S.lines.find(x => x.id === tog.dataset.toggle);
    if (l) setHeld('lines', viewYm, l.id, lineIsPaid(l, viewYm) ? undefined : 'paid');
    return save();
  }

  const gt = hit('[data-goal-toggle]');
  if (gt){
    const g = S.goals.find(x => x.id === gt.dataset.goalToggle);
    const moved = g && goalMoved(g, viewYm);
    if (moved){
      g.saved = Math.max(0, (+g.saved || 0) - (+moved.amount || 0));
      setHeld('goals', viewYm, g.id, undefined);
    } else if (g){
      const amount = goalMonthly(g, viewYm);   // read before it shifts
      g.saved = (+g.saved || 0) + amount;
      setHeld('goals', viewYm, g.id, { amount });
    }
    return save();
  }

  const cf = hit('[data-conflict]');
  if (cf) return void resolveConflict(cf.dataset.conflict === 'mine');

  const tab = hit('[data-tab]');
  if (tab){ view = tab.dataset.tab; return render(); }

  const step = hit('[data-mstep]');
  if (step){ viewYm = ymAdd(viewYm, +step.dataset.mstep); return render(); }
  if (hit('[data-mjump]')){ viewYm = thisMonthKey(); return render(); }

  if (hit('[data-settings]')) return openSheet({ type:'settings', draft: {
    displayCurrency: S.displayCurrency, rates: { ...S.rates }, haircut: S.haircut,
    cycleDay: S.cycleDay, provision: { ...S.provision },
    sync: { ...sync }, backup: backupJSON(), backupWas: backupJSON() } });

  for (const [attr, type, list, blank] of [
    // Something newly added opens ready to be typed into, rather than starting
    // out assumed — you are adding it because you know the figure.
    ['data-edit-account', 'account', S.accounts,
      { name:'', currency:S.displayCurrency, balance:'', floor:'', mode:'manual' }],
    ['data-edit-card',    'card',    S.cards,
      { name:'', currency:S.displayCurrency, outstanding:'', mode:'manual' }],
    ['data-edit-line',    'line',    S.lines,    { name:'', currency:S.displayCurrency, amount:'',
                                                   group:'due', status:'pending', repeats:'yes',
                                                   month: viewYm }],
    ['data-edit-goal',    'goal',    S.goals,    { name:'', currency:S.displayCurrency, target:'',
                                                   saved:'', by: defaultBy() }]
  ]){
    const el = hit('[' + attr + ']');
    if (!el) continue;
    const rec = list.find(x => x.id === el.getAttribute(attr));
    const draft = rec ? { ...rec } : { ...blank };
    if (rec && type === 'line'){
      const stamp = rec.repeats ? viewYm : (rec.month || viewYm);
      draft.repeats = rec.repeats ? 'yes' : 'no';
      draft.month = rec.month || viewYm;
      draft.status = lineIsPaid(rec, stamp) ? 'paid' : 'pending';
    }
    if (rec && (type === 'account' || type === 'card')){
      const kind = type === 'card' ? 'cards' : 'accounts';
      const set = isSet(kind, viewYm, rec.id);
      draft.mode = set ? 'manual' : 'auto';
      if (type === 'card') draft.outstanding = set ? cardValue(rec, viewYm) : '';
      else draft.balance = set ? accountValue(rec, viewYm) : '';
    }
    return openSheet({ type, id: rec && rec.id, isNew: !rec, draft });
  }

  const sg = hit('[data-seg]');
  if (sg){
    captureDraft();
    setPath(sheetState.draft, sg.dataset.seg, sg.dataset.val);
    return render();
  }

  if (hit('[data-save]')) return commit();
  if (hit('[data-close]') || e.target.classList.contains('backdrop')){
    sheetState = null; return render();
  }
  if (hit('[data-delete]')){
    const kind = sheetState.type === 'account' ? 'accounts'
               : sheetState.type === 'card'    ? 'cards'
               : sheetState.type === 'goal'    ? 'goals' : 'lines';
    const list = S[kind];
    const i = list.findIndex(x => x.id === sheetState.id);
    if (i >= 0) list.splice(i, 1);
    // Otherwise its figures would sit in every month it was ever typed into.
    for (const k of Object.keys(S.months)) setHeld(kind, k, sheetState.id, undefined);
    sheetState = null;
    return save();
  }
});

render();
if (syncOn()) runSync();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && syncInfo.status !== 'conflict') runSync();
});
</script>
</body>
</html>
